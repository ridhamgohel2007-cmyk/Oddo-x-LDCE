    <script>
      (function() {
        try {
          var mode = localStorage.getItem('globetrotter_theme_mode') || 'system';
          var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFC] dark:bg-[#0B1320] text-slate-900 dark:text-slate-100 font-sans antialiased transition-colors duration-300">
